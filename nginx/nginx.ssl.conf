# ── Aurum PMS — HTTPS nginx config ──────────────────────────────────────────
# Activated by setup-ssl.sh after Let's Encrypt certs are provisioned.
# Replace nginx.prod.conf with this file, then reload nginx.

upstream backend  { server backend:8000;  keepalive 32; }
upstream frontend { server frontend:80;   keepalive 16; }

# ── HTTP → HTTPS redirect ────────────────────────────────────────────────────
server {
    listen 80;
    server_name _;
    server_tokens off;

    # Keep ACME renewal working over HTTP
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ── HTTPS server ─────────────────────────────────────────────────────────────
server {
    listen 443 ssl http2;
    server_name YOUR_DOMAIN;          # <-- replaced by setup-ssl.sh

    server_tokens off;
    client_max_body_size 20M;

    # ── TLS certificates (from Let's Encrypt / certbot) ──────────────────
    ssl_certificate     /etc/letsencrypt/live/YOUR_DOMAIN/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/YOUR_DOMAIN/privkey.pem;

    # Modern TLS settings
    ssl_protocols             TLSv1.2 TLSv1.3;
    ssl_ciphers               ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache         shared:SSL:10m;
    ssl_session_timeout       1d;
    ssl_session_tickets       off;

    # OCSP stapling
    ssl_stapling        on;
    ssl_stapling_verify on;

    # ── Let's Encrypt ACME (for renewal) ─────────────────────────────────
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # ── API proxy ─────────────────────────────────────────────────────────
    location /api/ {
        proxy_pass         http://backend;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
        proxy_set_header   Connection        "";
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    location /docs         { proxy_pass http://backend; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto https; }
    location /openapi.json { proxy_pass http://backend; proxy_set_header Host $host; }

    # ── React SPA ─────────────────────────────────────────────────────────
    location / {
        proxy_pass         http://frontend;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;

        # Cache hashed static assets from Vite
        location ~* \.(js|css|woff2?|png|jpg|svg|ico)$ {
            proxy_pass http://frontend;
            add_header Cache-Control "public, immutable, max-age=31536000";
        }
    }

    # ── Security headers ──────────────────────────────────────────────────
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options           "SAMEORIGIN"                                   always;
    add_header X-Content-Type-Options    "nosniff"                                      always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin"              always;
    add_header X-XSS-Protection          "1; mode=block"                                always;
}
