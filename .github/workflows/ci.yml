name: CI

on:
  workflow_call: {}
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ── Backend: lint → type check → migrate → test ──────────────────────────
  backend:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: pms
          POSTGRES_PASSWORD: pms
          POSTGRES_DB: pms_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U pms"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: backend

    env:
      DATABASE_URL: postgresql://pms:pms@localhost:5432/pms_test
      REDIS_URL: redis://localhost:6379/0
      FERNET_KEY: "dGVzdC1rZXktMzItYnl0ZXMtdXJsLXNhZmU="
      JWT_SECRET: ci-test-secret-min-32-characters-long
      ENVIRONMENT: test
      DEBUG: "true"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Lint (ruff)
        run: ruff check .

      - name: Type check (mypy)
        run: mypy app/ --ignore-missing-imports

      - name: Run migrations
        run: alembic upgrade head

      - name: Unit & integration tests
        run: pytest -v --tb=short --junitxml=test-results.xml --cov=app --cov-report=term-missing --cov-report=xml:coverage.xml

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: |
            backend/test-results.xml
            backend/coverage.xml

  # ── Frontend: type check → build ─────────────────────────────────────────
  frontend:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Tests
        run: npm test

      - name: Build
        run: npm run build

  # ── Docker build smoke test ──────────────────────────────────────────────
  docker:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4

      - name: Build backend image
        run: docker build -t aurum-pms-backend ./backend

      - name: Build frontend image
        run: docker build -t aurum-pms-frontend ./frontend
