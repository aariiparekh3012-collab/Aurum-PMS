version: "3.9"

# ── Production compose — for VPS / self-hosted deployment ──────────────────
# First-time setup (with SSL):
#   1. cp .env.example .env && fill in values
#   2. docker compose -f docker-compose.prod.yml up -d --build
#   3. bash scripts/setup-ssl.sh yourdomain.com you@email.com
#   4. BASE_URL=https://yourdomain.com/api/v1 python backend/scripts/seed_demo.py
#
# Subsequent starts: docker compose -f docker-compose.prod.yml up -d
#
# Traffic: internet → nginx:80/443 → (static frontend OR /api/* → backend:8000)

services:

  # ── PostgreSQL ──────────────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: pms
      POSTGRES_USER: pms_admin
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/01-init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pms_admin -d pms"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ── Redis ───────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 128mb --maxmemory-policy allkeys-lru
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── FastAPI backend ─────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://pms_admin:${DB_PASSWORD}@db:5432/pms
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: ${JWT_SECRET}
      PII_ENCRYPTION_KEY: ${PII_ENCRYPTION_KEY}
      ENVIRONMENT: production
      CORS_ORIGINS: ${CORS_ORIGINS}
      WORKERS: ${WORKERS:-3}
      SUREPASS_BASE_URL: ${SUREPASS_BASE_URL:-}
      SUREPASS_API_TOKEN: ${SUREPASS_API_TOKEN:-}
      DIGIO_BASE_URL: ${DIGIO_BASE_URL:-}
      DIGIO_CLIENT_ID: ${DIGIO_CLIENT_ID:-}
      DIGIO_CLIENT_SECRET: ${DIGIO_CLIENT_SECRET:-}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/healthz')\""]
      interval: 30s
      timeout: 10s
      retries: 5

  # ── React frontend (built static files served by its own nginx) ─────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: /api/v1    # nginx routes /api/* to backend on same host
    restart: unless-stopped
    depends_on:
      - backend

  # ── Nginx reverse proxy ─────────────────────────────────────────────────
  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.prod.conf:/etc/nginx/conf.d/default.conf:ro
      - certbot-www:/var/www/certbot:ro          # ACME challenge files
      - certbot-certs:/etc/letsencrypt:ro        # TLS certs from certbot
    depends_on:
      - frontend
      - backend

  # ── Certbot — provisions & auto-renews Let's Encrypt certs ─────────────
  certbot:
    image: certbot/certbot:latest
    restart: unless-stopped
    volumes:
      - certbot-www:/var/www/certbot             # shared with nginx (ACME)
      - certbot-certs:/etc/letsencrypt           # shared with nginx (certs)
    # Renews certs every 12 h; certbot only acts when expiry is < 30 days
    entrypoint: >
      sh -c "trap exit TERM;
             while :; do
               certbot renew --webroot -w /var/www/certbot --quiet;
               sleep 12h &
               wait $${!};
             done"

volumes:
  pgdata:
  redisdata:
  certbot-www:    # certbot writes ACME challenges here; nginx reads them
  certbot-certs:  # certbot writes certs here; nginx reads them
