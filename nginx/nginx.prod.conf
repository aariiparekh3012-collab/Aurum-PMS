# ── Aurum PMS — Production nginx config ─────────────────────────────────────
# Phase 1 (HTTP only, before SSL):  used during initial cert provisioning
# Phase 2 (HTTPS):                  swap to nginx.ssl.conf after running setup-ssl.sh
#
# Traffic:
#   /                          → React SPA
#   /api/*  /docs /openapi.json → FastAPI backend:8000
#   /.well-known/acme-challenge → certbot webroot (for Let's Encrypt)

upstream backend  { server backend:8000;  keepalive 32; }
upstream frontend { server frontend:80;   keepalive 16; }

server {
    listen 80;
    server_name _;

    server_tokens off;
    client_max_body_size 20M;

    # ── Let's Encrypt ACME challenge (must stay on HTTP) ─────────────────
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # ── API proxy ──────────────────────────────────────────────────────────
    location /api/ {
        proxy_pass         http://backend;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        '';
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    location /docs        { proxy_pass http://backend; proxy_set_header Host $host; }
    location /openapi.json { proxy_pass http://backend; proxy_set_header Host $host; }

    # ── React SPA ──────────────────────────────────────────────────────────
    location / {
        proxy_pass         http://frontend;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
    }

    add_header X-Frame-Options        'SAMEORIGIN'                          always;
    add_header X-Content-Type-Options 'nosniff'                             always;
    add_header Referrer-Policy        'strict-origin-when-cross-origin'     always;
}
